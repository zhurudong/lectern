<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Lectern 图标(小尺寸版,用于 16/32):同一诵读台语义,但**笔画加粗、细节减量**。
       16×16 上每个 SVG 单位只有 1/8 像素,细节版的三条代码行会糊成一个色块、
       立柱会细到消失 —— 所以这里放大主体、加粗立柱与底座、代码行由三条减到两条并加高。
       **不是"同一张图缩小",是为小尺寸重画的一版。** -->
  <rect width="128" height="128" rx="28" fill="#1b2540"/>

  <!-- 立柱与底座:明显加粗,16px 上仍能看出"台"的结构 -->
  <rect x="55" y="72" width="18" height="32" fill="#e9edf6"/>
  <rect x="34" y="99" width="60" height="14" rx="7" fill="#e9edf6"/>

  <!-- 斜面台板:加厚 -->
  <defs>
    <clipPath id="deck-sm">
      <path d="M26 58 L98 36 L106 62 L34 84 Z"/>
    </clipPath>
  </defs>
  <path d="M26 58 L98 36 L106 62 L34 84 Z" fill="#e9edf6"/>

  <!-- 代码行:16px 上**只留一条**。两条时,它们与白色台板一起糊成一个带色斑的白块
       (放大看过:蓝线并进台板、绿线只剩一小片色斑)。一条足够粗的横杠反而
       能在 16px 上稳定读出"台面上摊着一行东西"。 -->
  <g clip-path="url(#deck-sm)" transform="rotate(-16 64 60)">
    <rect x="40" y="54" width="48" height="12" rx="6" fill="#5b8cff"/>
  </g>
</svg>
